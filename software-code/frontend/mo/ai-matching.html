<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Matching Dashboard (MO) — TA Recruitment</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="sys-header">
      <div class="sys-header__inner">
        <span class="sys-title">BUPT International School TA Recruitment System</span>
        <div class="sys-header__actions">
          <a class="btn btn-secondary" href="dashboard.html">Back to MO Dashboard</a>
        </div>
      </div>
    </header>

    <div class="dashboard__main" style="max-width: 1100px; margin: 0 auto; padding: 1.5rem">
      <h2 class="dashboard__title">AI Matching Dashboard (MO)</h2>

      <div class="panel ai-table" id="ai-matching-mo">
        <div class="form-row" style="margin-bottom: 1rem; align-items: center; gap: 0.75rem; flex-wrap: wrap">
          <label for="mo-ai-job-select" style="font-weight: 600; margin: 0">Posted job</label>
          <select id="mo-ai-job-select" class="form-control" style="min-width: 280px; max-width: 100%">
            <option value="">Loading jobs…</option>
          </select>
          <span id="mo-ai-job-hint" class="text-muted" style="font-size: 0.9rem"></span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Applicant</th>
                <th>Match Score</th>
                <th>Matched Skills</th>
                <th>Missing Skills</th>
                <th>AI Analysis</th>
              </tr>
            </thead>
            <tbody id="mo-ai-applicants-body">
              <tr>
                <td colspan="5"><span class="ai-pending">Select a job to load applicants.</span></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="form-actions" style="margin-top: 1.25rem; justify-content: center">
          <button type="button" class="btn btn-accent" id="mo-ai-run-analysis" disabled>Run AI Analysis</button>
        </div>
      </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/mo-ai-matching.js"></script>
  </body>
</html>
