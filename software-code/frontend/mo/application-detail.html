<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Application Detail — MO</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var jobId = params.get("jobId");
        var appId = params.get("appId");
        if (jobId && appId) {
          location.replace(
            "mo-application-review.html?jobId=" +
              encodeURIComponent(jobId) +
              "&appId=" +
              encodeURIComponent(appId)
          );
          return;
        }
        location.replace("dashboard.html?section=applications");
      })();
    </script>
  </body>
</html>
